   viewBox="0 0 8.4666661 8.4666661"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <g id="layer1">
    <!-- Horizontal beam (base) -->
    <rect
       x="0.2"
       y="7.2"
       width="8.067"
       height="0.6"
       rx="0.1"
       style="fill:#444444;stroke:none;" />
    <!-- Distributed load arrows (4 arrows pointing down) -->
    <!-- Arrow 1 -->
    <path d="M 1.2,1.0 V 5.8 L 0.7,5.1 M 1.2,5.8 L 1.7,5.1"
       style="fill:none;stroke:#1966ff;stroke-width:0.45;stroke-linecap:round;stroke-linejoin:round;" />
    <!-- Arrow 2 -->
    <path d="M 2.9,1.0 V 5.8 L 2.4,5.1 M 2.9,5.8 L 3.4,5.1"
       style="fill:none;stroke:#1966ff;stroke-width:0.45;stroke-linecap:round;stroke-linejoin:round;" />
    <!-- Arrow 3 -->
    <path d="M 4.6,1.0 V 5.8 L 4.1,5.1 M 4.6,5.8 L 5.1,5.1"
       style="fill:none;stroke:#1966ff;stroke-width:0.45;stroke-linecap:round;stroke-linejoin:round;" />
    <!-- Arrow 4 -->
    <path d="M 6.3,1.0 V 5.8 L 5.8,5.1 M 6.3,5.8 L 6.8,5.1"
       style="fill:none;stroke:#1966ff;stroke-width:0.45;stroke-linecap:round;stroke-linejoin:round;" />
    <!-- Top horizontal line connecting arrow tops -->
    <line x1="1.2" y1="1.0" x2="6.3" y2="1.0"
       style="stroke:#1966ff;stroke-width:0.45;stroke-linecap:round;" />
    <!-- Distribution curve / area fill (light blue) -->
    <rect x="1.0" y="1.0" width="5.5" height="4.9"
